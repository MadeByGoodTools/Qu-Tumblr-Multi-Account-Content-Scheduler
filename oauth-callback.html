<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Qu — Tumblr authorization</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f7f7fb;
        background: #090b12;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(77, 220, 156, .17), transparent 32rem),
          radial-gradient(circle at 90% 90%, rgba(102, 92, 255, .20), transparent 34rem),
          #090b12;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 28px;
        background: rgba(18, 21, 33, .88);
        box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
      }

      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin-bottom: 24px;
        border-radius: 18px;
        color: #07110d;
        background: linear-gradient(145deg, #98f7c9, #35d68b);
        font-size: 30px;
        font-weight: 900;
      }

      h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 42px); }
      p { margin: 0; color: #b7bbca; line-height: 1.6; }

      .callback {
        margin: 28px 0 16px;
        padding: 16px;
        overflow-wrap: anywhere;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 14px;
        color: #dfe2ee;
        background: #0b0e17;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        color: #07110d;
        background: linear-gradient(135deg, #91f4c3, #38d98f);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:focus-visible { outline: 3px solid #b9ffdc; outline-offset: 3px; }
      #status { min-height: 1.5em; margin-top: 12px; text-align: center; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>
      <h1>Connecting to Qu…</h1>
      <p id="message">Finishing Tumblr authorization. This should only take a moment.</p>
    </main>

    <script>
      const source = new URLSearchParams(window.location.search);
      const destination = new URL("https://qu-tumblr-auth.nullgurl.workers.dev/v1/oauth/callback");
      for (const name of ["code", "state", "oauth_token", "oauth_verifier", "error", "error_description"]) {
        const value = source.get(name);
        if (value) destination.searchParams.set(name, value);
      }
      const hasOAuth2 = destination.searchParams.has("code") && destination.searchParams.has("state");
      const hasOAuth1 = destination.searchParams.has("oauth_token") && destination.searchParams.has("oauth_verifier");
      if (!destination.searchParams.has("error") && !hasOAuth2 && !hasOAuth1) {
        document.getElementById("message").textContent =
          "Tumblr did not return a complete authorization response. Return to Qu and try again.";
      } else {
        window.location.replace(destination.toString());
      }
    </script>
  </body>
</html>
